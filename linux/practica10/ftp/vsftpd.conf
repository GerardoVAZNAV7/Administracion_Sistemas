# ============================================================
# vsftpd.conf — Configuración del servidor FTP
# ============================================================

# Permitir usuarios locales del sistema
local_enable=YES

# Permitir subida de archivos
write_enable=YES

# NO permitir acceso anónimo (seguridad)
anonymous_enable=NO

# Encerrar a los usuarios en su carpeta home (jaula chroot)
chroot_local_user=YES
allow_writeable_chroot=YES

# Modo pasivo (necesario para trabajar detrás de Docker)
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21105

# Dirección para modo pasivo (se sobreescribe al iniciar)
pasv_address=0.0.0.0

# Logs
xferlog_enable=YES

# Puerto de control
listen=YES
listen_port=21

# Carpeta raíz del usuario FTP
local_root=/ftp/webfiles
