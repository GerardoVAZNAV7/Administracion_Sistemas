# Práctica 10 — Migración de servicios a contenedores
# Gerardo Miguel Vázquez Navarro

networks:
  infra_red:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  db_data:
  web_content:

services:

  # ── Base de datos PostgreSQL ──────────────────────────────────────────────
  db_postgres:
    image: postgres:15-alpine
    container_name: db_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: empresa
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/backup_postgres.sh:/backup.sh
      - /srv/backups/postgres:/backups
    networks:
      infra_red:
        ipv4_address: 172.20.0.20
    restart: unless-stopped

  # ── Servidor Web NGINX personalizado ─────────────────────────────────────
  web_server:
    build:
      context: ./nginx
    container_name: web_server
    ports:
      - "80:80"
    volumes:
      - web_content:/usr/share/nginx/html/files
    networks:
      infra_red:
        ipv4_address: 172.20.0.10
    mem_limit: 512m
    cpus: "0.5"
    depends_on:
      - db_postgres
    restart: unless-stopped

  # ── Servidor FTP ──────────────────────────────────────────────────────────
  ftp_server:
    build:
      context: ./ftp
    container_name: ftp_server
    environment:
      FTP_USER: ftpuser
      FTP_PASS: ftp12345
    volumes:
      - web_content:/ftp/webfiles
    ports:
      - "21:21"
      - "21100-21105:21100-21105"
    networks:
      infra_red:
        ipv4_address: 172.20.0.30
    restart: unless-stopped

  # ── BusyBox para pruebas de red (ping) ───────────────────────────────────
  busybox:
    image: busybox:latest
    container_name: busybox
    networks:
      infra_red:
        ipv4_address: 172.20.0.40
    command: ["sleep", "infinity"]
    restart: unless-stopped
