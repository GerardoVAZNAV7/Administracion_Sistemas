user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ── SEGURIDAD: ocultar versión del servidor ──
    server_tokens off;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    server {
        listen       80;
        server_name  _;

        # ── Página principal ──────────────────────────────────────────────
        location = / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        location = /index.html {
            root   /usr/share/nginx/html;
        }

        # ── Recursos estáticos (css, img, js) ────────────────────────────
        location /css/ {
            root /usr/share/nginx/html;
        }
        location /img/ {
            root /usr/share/nginx/html;
        }

        # ── Directorio de archivos FTP (compartido con ftp_server) ───────
        # Soporta: listado JSON, descarga y subida WebDAV PUT
        location /files/ {
            alias /usr/share/nginx/html/files/;

            # Listado de directorio (necesario para que la página lea los archivos)
            autoindex on;
            autoindex_format json;      # devuelve JSON: [{name, type, mtime, size}]
            autoindex_exact_size on;    # tamaño en bytes exactos
            autoindex_localtime on;

            # WebDAV: permite subir archivos desde el navegador (drag & drop)
            dav_methods PUT DELETE;
            dav_access  user:rw  group:r  all:r;
            create_full_put_path on;

            # CORS para fetch() desde la misma página
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";

            # Responder OPTIONS sin cuerpo (preflight)
            if ($request_method = OPTIONS) {
                return 204;
            }

            # Sin caché para que el listado siempre sea fresco
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ── Errores ───────────────────────────────────────────────────────
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}