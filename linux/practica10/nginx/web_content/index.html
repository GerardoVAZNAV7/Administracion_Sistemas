<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>srv-web / archivos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --surface: #111111;
      --border:  #1f1f1f;
      --muted:   #3a3a3a;
      --text:    #e8e8e8;
      --dim:     #666;
      --accent:  #f0f0f0;
      --green:   #4ade80;
      --red:     #f87171;
      --blue:    #60a5fa;
      --yellow:  #fbbf24;
      --radius:  4px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ── */
    .shell {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    .logo {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      color: var(--dim);
      letter-spacing: 0.05em;
    }
    .logo span { color: var(--accent); font-weight: 500; }
    .status-dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .srv-status {
      font-size: 11px;
      color: var(--dim);
      font-family: 'Geist Mono', monospace;
      margin-left: auto;
    }

    /* ── Upload zone ── */
    .drop-zone {
      border: 1px dashed var(--muted);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 32px;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.over {
      border-color: var(--accent);
      background: rgba(255,255,255,0.02);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon {
      font-size: 22px;
      margin-bottom: 8px;
      color: var(--dim);
    }
    .drop-label {
      font-size: 13px;
      color: var(--dim);
    }
    .drop-label em { color: var(--accent); font-style: normal; text-decoration: underline; text-underline-offset: 3px; }

    /* ── Upload progress ── */
    #upload-status {
      display: none;
      margin-bottom: 20px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      color: var(--dim);
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .toolbar-left {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: var(--dim);
    }
    .toolbar-left span { color: var(--accent); }
    .filter-input {
      margin-left: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 10px;
      font-size: 12px;
      font-family: 'Geist Mono', monospace;
      color: var(--text);
      outline: none;
      width: 180px;
      transition: border-color 0.15s;
    }
    .filter-input:focus { border-color: var(--muted); }
    .filter-input::placeholder { color: var(--muted); }

    /* ── File list ── */
    .file-list {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .file-list-header {
      display: grid;
      grid-template-columns: 1fr 90px 100px;
      padding: 8px 14px;
      background: var(--surface);
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .file-row {
      display: grid;
      grid-template-columns: 1fr 90px 100px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: background 0.1s;
      cursor: pointer;
    }
    .file-row:last-child { border-bottom: none; }
    .file-row:hover { background: rgba(255,255,255,0.025); }
    .file-row.empty-row { cursor: default; }
    .file-row.empty-row:hover { background: transparent; }

    .file-name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .file-icon {
      font-size: 13px;
      flex-shrink: 0;
      width: 18px;
      text-align: center;
    }
    .file-name {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: var(--dim);
    }
    .file-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }
    .btn-sm {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--dim);
      font-size: 11px;
      font-family: 'Geist Mono', monospace;
      padding: 3px 8px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-preview:hover { border-color: var(--blue); color: var(--blue); }

    .empty-state {
      padding: 48px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-family: 'Geist Mono', monospace;
    }

    /* ── Preview modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
      max-width: 760px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .modal-title {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-close {
      background: none; border: none; color: var(--dim);
      font-size: 18px; cursor: pointer; line-height: 1;
      padding: 0 4px;
      transition: color 0.1s;
    }
    .modal-close:hover { color: var(--accent); }
    .modal-body {
      flex: 1;
      overflow: auto;
      padding: 0;
    }
    .preview-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      margin: 0 auto;
      object-fit: contain;
    }
    .preview-text {
      padding: 20px;
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text);
      line-height: 1.7;
    }
    .preview-video { width: 100%; display: block; }
    .preview-pdf   { width: 100%; height: 60vh; border: none; display: block; }
    .preview-unsupported {
      padding: 48px;
      text-align: center;
      color: var(--dim);
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 12px;
      font-family: 'Geist Mono', monospace;
      color: var(--text);
      transform: translateY(12px);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.ok   { border-color: var(--green); color: var(--green); }
    #toast.err  { border-color: var(--red);   color: var(--red); }
  </style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo"><span>srv-web</span> / archivos</div>
    <div class="srv-status"><span class="status-dot"></span>online</div>
  </header>

  <!-- Drop zone for upload -->
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" multiple />
    <div class="drop-icon">↑</div>
    <div class="drop-label">arrastra archivos aquí o <em>haz clic para seleccionar</em></div>
  </div>

  <!-- Upload feedback -->
  <div id="upload-status"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      archivos — <span id="file-count">0</span>
    </div>
    <input class="filter-input" type="text" id="filterInput" placeholder="filtrar..." />
  </div>

  <!-- File list -->
  <div class="file-list" id="fileList">
    <div class="file-list-header">
      <span>nombre</span>
      <span>tamaño</span>
      <span></span>
    </div>
    <div class="empty-state" id="emptyState">sin archivos todavía</div>
  </div>

</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">—</span>
      <a id="modalDownload" href="#" class="btn-sm">↓ descargar</a>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ─── File type helpers ───────────────────────────────────────────────────────
const EXT_MAP = {
  image:  ['png','jpg','jpeg','gif','webp','svg','bmp','ico'],
  video:  ['mp4','webm','ogg','mov'],
  audio:  ['mp3','wav','ogg','flac'],
  pdf:    ['pdf'],
  text:   ['txt','md','sh','bash','py','js','ts','json','yaml','yml','xml','html','htm','css','conf','env','log','ini','cfg','toml','sql'],
  zip:    ['zip','tar','gz','rar','7z'],
};
const ICONS = {
  image:'🖼', video:'▶', audio:'♪', pdf:'📄', text:'📝', zip:'📦', default:'📎'
};

function getType(name) {
  const ext = name.split('.').pop().toLowerCase();
  for (const [type, exts] of Object.entries(EXT_MAP))
    if (exts.includes(ext)) return type;
  return 'default';
}

function fmtSize(bytes) {
  if (bytes == null) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024**2) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024**2).toFixed(1) + ' MB';
}

// ─── State ───────────────────────────────────────────────────────────────────
let ALL_FILES = [];

// ─── Load file list via NGINX autoindex JSON ──────────────────────────────
async function loadFiles() {
  try {
    const res = await fetch('/files/?format=json', { cache: 'no-cache' });
    if (!res.ok) throw new Error();
    const data = await res.json();
    ALL_FILES = data
      .filter(f => f.type === 'file')
      .map(f => ({ name: f.name, size: f.size || null, mtime: f.mtime || null }));
  } catch {
    // Fallback: fetch directory listing HTML and parse hrefs
    try {
      const res = await fetch('/files/', { cache: 'no-cache' });
      const html = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const links = [...doc.querySelectorAll('a[href]')]
        .map(a => a.getAttribute('href'))
        .filter(h => h && !h.startsWith('?') && h !== '../' && !h.endsWith('/'));
      ALL_FILES = links.map(name => ({ name: decodeURIComponent(name), size: null }));
    } catch { ALL_FILES = []; }
  }
  renderList(ALL_FILES);
}

function renderList(files) {
  const list = document.getElementById('fileList');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('file-count');
  count.textContent = files.length;

  // Remove old rows (keep header + empty)
  [...list.querySelectorAll('.file-row')].forEach(r => r.remove());
  empty.style.display = files.length ? 'none' : 'block';

  files.forEach(file => {
    const type = getType(file.name);
    const icon = ICONS[type] || ICONS.default;
    const url  = '/files/' + encodeURIComponent(file.name);

    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      <div class="file-name-cell">
        <span class="file-icon">${icon}</span>
        <span class="file-name">${escHtml(file.name)}</span>
      </div>
      <span class="file-size">${fmtSize(file.size)}</span>
      <div class="file-actions">
        ${canPreview(type) ? `<button class="btn-sm btn-preview" data-name="${escHtml(file.name)}" data-url="${url}" data-type="${type}">⊙ ver</button>` : ''}
        <a class="btn-sm" href="${url}" download>↓</a>
      </div>
    `;
    list.appendChild(row);
  });

  // Preview button listeners
  list.querySelectorAll('.btn-preview').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openPreview(btn.dataset.name, btn.dataset.url, btn.dataset.type);
    });
  });
}

function canPreview(type) {
  return ['image','video','audio','pdf','text'].includes(type);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Filter ──────────────────────────────────────────────────────────────────
document.getElementById('filterInput').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  const filtered = ALL_FILES.filter(f => f.name.toLowerCase().includes(q));
  renderList(filtered);
});

// ─── Preview Modal ───────────────────────────────────────────────────────────
async function openPreview(name, url, type) {
  const overlay = document.getElementById('modalOverlay');
  const title   = document.getElementById('modalTitle');
  const body    = document.getElementById('modalBody');
  const dlBtn   = document.getElementById('modalDownload');

  title.textContent = name;
  dlBtn.href = url;
  dlBtn.download = name;
  body.innerHTML = '<div class="preview-unsupported">cargando…</div>';
  overlay.classList.add('open');

  if (type === 'image') {
    body.innerHTML = `<img class="preview-image" src="${url}" alt="${escHtml(name)}" />`;
  } else if (type === 'video') {
    body.innerHTML = `<video class="preview-video" controls autoplay><source src="${url}"></video>`;
  } else if (type === 'audio') {
    body.innerHTML = `<div style="padding:32px;text-align:center"><audio controls src="${url}"></audio></div>`;
  } else if (type === 'pdf') {
    body.innerHTML = `<iframe class="preview-pdf" src="${url}"></iframe>`;
  } else if (type === 'text') {
    try {
      const res = await fetch(url);
      const text = await res.text();
      const pre = document.createElement('pre');
      pre.className = 'preview-text';
      pre.textContent = text;
      body.innerHTML = '';
      body.appendChild(pre);
    } catch {
      body.innerHTML = '<div class="preview-unsupported">no se pudo cargar el archivo</div>';
    }
  } else {
    body.innerHTML = '<div class="preview-unsupported">previsualización no disponible — descárgalo</div>';
  }
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalBody').innerHTML = '';
});
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) {
    this.classList.remove('open');
    document.getElementById('modalBody').innerHTML = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('modalBody').innerHTML = '';
  }
});

// ─── Upload via HTTP (NGINX upload module / WebDAV PUT) ──────────────────────
// NGINX must be configured with dav_methods PUT; (see nginx.conf)
async function uploadFile(file) {
  const status = document.getElementById('upload-status');
  status.style.display = 'block';
  status.textContent = `↑ subiendo: ${file.name} …`;

  try {
    const res = await fetch('/files/' + encodeURIComponent(file.name), {
      method: 'PUT',
      body: file,
      headers: { 'Content-Type': file.type || 'application/octet-stream' }
    });
    if (res.ok || res.status === 201 || res.status === 204) {
      toast(`${file.name} subido`, 'ok');
      await loadFiles();
    } else {
      toast(`error ${res.status}`, 'err');
    }
  } catch (err) {
    toast('error al subir', 'err');
  } finally {
    status.style.display = 'none';
  }
}

// ─── Drag & Drop + File Input ─────────────────────────────────────────────────
const dropZone  = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  [...e.dataTransfer.files].forEach(uploadFile);
});
fileInput.addEventListener('change', () => {
  [...fileInput.files].forEach(uploadFile);
  fileInput.value = '';
});

// ─── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 2800);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
loadFiles();
setInterval(loadFiles, 10000); // auto-refresh every 10s
</script>
</body>
</html>
