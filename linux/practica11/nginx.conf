# ============================================================
#  nginx.conf — Balanceador de carga + Frontend público
#  Oculta cabecera "Server" y redirige tráfico al app interno
# ============================================================

events {
    worker_connections 1024;
}

http {
    # ── Ocultar versión del servidor ──────────────────────────
    server_tokens off;

    # ── Upstream: servidor de aplicaciones interno ────────────
    upstream app_backend {
        server webserver:80;        # nombre de servicio docker-compose
    }

    server {
        listen 80;
        server_name _;

        # ── Cabeceras de seguridad básicas ────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # ── Ruta raíz → balanceador → webserver interno ───────
        location / {
            proxy_pass         http://app_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_hide_header  Server;           # oculta la cabecera Server del backend
        }

        # ── Estado de salud del balanceador ───────────────────
        location /nginx-health {
            return 200 "nginx OK\n";
            add_header Content-Type text/plain;
        }
    }
}
