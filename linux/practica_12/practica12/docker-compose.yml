# ============================================================
#  docker-compose.yml — Práctica 12 + 13
#  Servidor de correo privado + Portal Webmail Roundcube
#  HTTPS autofirmado via nginx proxy (puerto 8443)
#  Coexiste con práctica 11 (nginx en :80)
# ============================================================

services:

  # ──────────────────────────────────────────────────────────
  # 1. SERVIDOR DE CORREO (docker-mailserver)
  #    Integra: Postfix (SMTP) + Dovecot (IMAP) +
  #             Rspamd (antispam) + Fail2Ban + OpenDKIM
  # ──────────────────────────────────────────────────────────
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: p12_mailserver
    hostname: ${MAIL_HOSTNAME}
    restart: always
    env_file: .env
    environment:
      OVERRIDE_HOSTNAME:          ${MAIL_HOSTNAME}
      POSTMASTER_ADDRESS:         ${POSTMASTER_ADDRESS}
      SSL_TYPE:                   ${SSL_TYPE}
      ENABLE_RSPAMD:              ${RSPAMD_ENABLED}
      ENABLE_CLAMAV:              0
      ENABLE_FAIL2BAN:            ${FAIL2BAN_ENABLED}
      FAIL2BAN_BLOCKTYPE:         drop
      ENABLE_OPENDKIM:            1
      OPENDKIM_DOMAIN:            ${MAIL_DOMAIN}
      LOG_LEVEL:                  debug
      POSTFIX_INET_PROTOCOLS:     ipv4
      SMTP_ONLY:                  0
      ENABLE_QUOTAS:              1
      ENABLE_MANAGESIEVE:         1
      ENABLE_SPAMASSASSIN:        0
      ENABLE_AMAVIS:              0
    ports:
      - "${SMTP_PORT}:25"
      - "${SMTP_SUBMISSION_PORT}:587"
      - "${SMTP_SUBMISSIONS_PORT}:465"
      - "${IMAP_PORT}:143"
      - "${IMAPS_PORT}:993"
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver
      - ./certs:/tmp/ssl:ro
    networks:
      - red_correo
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:false
    healthcheck:
      test: ["CMD", "ss", "-lnt", "|", "grep", ":25"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ──────────────────────────────────────────────────────────
  # 2. BASE DE DATOS PARA ROUNDCUBE (MariaDB)
  # ──────────────────────────────────────────────────────────
  roundcube_db:
    image: mariadb:11
    container_name: p12_roundcube_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROUNDCUBE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${ROUNDCUBE_DB_NAME}
      MYSQL_USER:          ${ROUNDCUBE_DB_USER}
      MYSQL_PASSWORD:      ${ROUNDCUBE_DB_PASSWORD}
    volumes:
      - roundcube_db_data:/var/lib/mysql
    networks:
      - red_correo
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # 3. PORTAL WEBMAIL (Roundcube) — solo HTTP interno
  #    El HTTPS lo maneja el nginx proxy (servicio de abajo)
  # ──────────────────────────────────────────────────────────
  roundcube:
    image: roundcube/roundcubemail:latest-apache
    container_name: p12_roundcube
    restart: always
    depends_on:
      roundcube_db:
        condition: service_healthy
      mailserver:
        condition: service_started
    environment:
      ROUNDCUBEMAIL_DB_TYPE:              mysql
      ROUNDCUBEMAIL_DB_HOST:              roundcube_db
      ROUNDCUBEMAIL_DB_PORT:              3306
      ROUNDCUBEMAIL_DB_NAME:              ${ROUNDCUBE_DB_NAME}
      ROUNDCUBEMAIL_DB_USER:              ${ROUNDCUBE_DB_USER}
      ROUNDCUBEMAIL_DB_PASSWORD:          ${ROUNDCUBE_DB_PASSWORD}
      # IMAP: usa TLS con el mailserver interno
      ROUNDCUBEMAIL_DEFAULT_HOST:         tls://mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT:         993
      # SMTP: STARTTLS en 587
      ROUNDCUBEMAIL_SMTP_SERVER:          tls://mailserver
      ROUNDCUBEMAIL_SMTP_PORT:            587
      ROUNDCUBEMAIL_DES_KEY:              ${ROUNDCUBE_DES_KEY}
      ROUNDCUBEMAIL_SKIN:                 elastic
      ROUNDCUBEMAIL_PRODUCT_NAME:         "Correo Reprobados.com"
      ROUNDCUBEMAIL_USERNAME_DOMAIN:      reprobados.com
      ROUNDCUBEMAIL_SESSION_LIFETIME:     ${ROUNDCUBE_SESSION_TIMEOUT}
      ROUNDCUBEMAIL_SSL_VERIFY_PEER:      0
      ROUNDCUBEMAIL_SSL_VERIFY_PEER_NAME: 0
      ROUNDCUBEMAIL_SSL_CAFILE:           ""
    # ⚠ SIN puertos expuestos al host — el nginx proxy es el único
    #   que habla con el exterior. Roundcube solo es accesible
    #   dentro de la red Docker (red_correo).
    expose:
      - "80"
    volumes:
      - roundcube_data:/var/roundcube/db
      - roundcube_logs:/var/log/roundcube
      - ./roundcube/config.inc.php:/var/roundcube/config/config.inc.php:ro
    networks:
      - red_correo
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ──────────────────────────────────────────────────────────
  # 4. NGINX — Proxy SSL para Roundcube
  #    Termina TLS con certificado autofirmado.
  #    Puerto 8080 → HTTP (redirige a HTTPS)
  #    Puerto 8443 → HTTPS ✓
  # ──────────────────────────────────────────────────────────
  roundcube_ssl:
    image: nginx:alpine
    container_name: p12_roundcube_ssl
    restart: always
    depends_on:
      roundcube:
        condition: service_healthy
    ports:
      - "${ROUNDCUBE_PORT}:80"        # HTTP → redirige a HTTPS
      - "${ROUNDCUBE_SSL_PORT}:443"   # HTTPS con TLS autofirmado
    volumes:
      # Configuración nginx (la misma carpeta del proyecto)
      - ./nginx/roundcube-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados autofirmados generados por setup.sh
      - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
    networks:
      - red_correo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

# ============================================================
#  REDES
# ============================================================
networks:
  red_correo:
    driver: bridge
    name: practica12_red_correo

# ============================================================
#  VOLÚMENES NOMBRADOS
# ============================================================
volumes:
  mail_data:
    name: practica12_mail_data

  mail_state:
    name: practica12_mail_state

  mail_logs:
    name: practica12_mail_logs

  mail_config:
    name: practica12_mail_config

  roundcube_db_data:
    name: practica12_roundcube_db

  roundcube_data:
    name: practica12_roundcube_data

  roundcube_logs:
    name: practica12_roundcube_logs